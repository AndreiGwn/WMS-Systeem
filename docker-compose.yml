services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./:/app:rw
    environment:
      - SERVER_NAME=localhost
      - DATABASE_URL=mysql://wms_user:secret@db:3306/wms_db
      - MAIL_HOST=mail
      - MAIL_PORT=1025
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: wms_db
      MYSQL_USER: wms_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "wms_user", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  db_data:
